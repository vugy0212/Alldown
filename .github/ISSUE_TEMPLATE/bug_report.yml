name: Bug Report
description: Create a report to help us improve AllDown
labels: [ bug, new issue ]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: |
        Please verify the following before submitting a bug report for AllDown:
      options:
        - label: I've verified that I'm running the latest [**version**](https://github.com/vugy0212/Alldown/releases) of AllDown.
          required: true
        - label: I've read the [**Contributing guidelines**](https://github.com/vugy0212/Alldown/blob/main/CONTRIBUTING.md) and [**Code Of Conduct**](https://github.com/vugy0212/Alldown/blob/main/CODE_OF_CONDUCT.md).
          required: true

  - type: textarea
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: To Reproduce
      placeholder: |
        Steps to reproduce the behavior:
        1. Paste URL '...'
        2. Select format '...'
        3. Tap Start Download
        4. See error
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context / Device Info
      placeholder: Android version, device model, and any screenshots.
    validations:
      required: false

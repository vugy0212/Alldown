name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd alldown
          flutter pub get

      - name: Run Tests & Linter
        run: |
          cd alldown
          flutter analyze
          flutter test

      - name: Build Release APKs
        run: |
          cd alldown
          # Build Universal APK
          flutter build apk --release
          # Build ABI-specific APKs
          flutter build apk --release --split-per-abi

      - name: Rename & Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp alldown/build/app/outputs/flutter-apk/app-release.apk release-artifacts/AllDown-universal.apk
          cp alldown/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/AllDown-arm64-v8a.apk
          cp alldown/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/AllDown-armeabi-v7a.apk
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AllDown ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/AllDown-universal.apk
            release-artifacts/AllDown-arm64-v8a.apk
            release-artifacts/AllDown-armeabi-v7a.apk
            release-artifacts/SHA256SUMS.txt

